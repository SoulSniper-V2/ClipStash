name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: SwiftPM regression tests
        run: swift test --jobs 2
      - name: Build unsigned Xcode app and check packaged assets
        run: |
          for configuration in Debug Release; do
            xcodebuild -project ClipStash.xcodeproj -scheme ClipStash \
              -configuration "$configuration" -destination 'platform=macOS' \
              -derivedDataPath build -jobs 2 CODE_SIGNING_ALLOWED=NO build
            test -s "build/Build/Products/$configuration/ClipStash.app/Contents/Resources/Assets.car"
          done
